<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý người dùng — React CRUD</title>

  <!-- Bước 1: React, ReactDOM, Babel qua CDN (ghim phiên bản cụ thể) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --border: #e5e7eb;
      --row-hover: #f1f5ff;
      --overlay: rgba(0, 0, 0, 0.4);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161c;
        --card: #1d2029;
        --text: #e8eaf0;
        --muted: #9aa1ad;
        --accent: #60a5fa;
        --accent-text: #0b1220;
        --danger: #f87171;
        --border: #2c303b;
        --row-hover: #232838;
        --overlay: rgba(0, 0, 0, 0.6);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 32px 16px 48px; }
    .top-links { display: flex; gap: 16px; font-size: .9rem; margin-bottom: 12px; }
    .top-links a { color: var(--accent); text-decoration: none; }
    .top-links a:hover { text-decoration: underline; }
    h1 { margin: 0 0 20px; font-size: 1.7rem; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    .search {
      flex: 1 1 260px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    .search:focus, .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 6px 12px;
    }
    button:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); padding: 9px 16px; font-weight: 600; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-edit { color: var(--accent); }
    .btn-delete { color: var(--danger); }
    .btn-delete:hover { border-color: var(--danger); }

    .status { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--row-hover); }
    td.actions { white-space: nowrap; }
    td.actions button + button { margin-left: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 28px; }

    /* Bước 8: Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--overlay);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }
    .modal-content {
      background: var(--card);
      color: var(--text);
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
    }
    .modal-content h4 { margin: 0 0 14px; font-size: 1.15rem; }
    .field { display: grid; gap: 4px; margin-bottom: 10px; }
    .field label { font-size: .85rem; color: var(--muted); }
    .field input {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: .95rem;
    }
    .group-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Danh sách trường của form; street/suite/city thuộc đối tượng lồng address
    const MAIN_FIELDS = [
      ["name", "Họ tên *"],
      ["username", "Username *"],
      ["email", "Email"],
      ["phone", "Số điện thoại"],
      ["website", "Website"],
    ];
    const ADDRESS_FIELDS = [
      ["street", "Đường"],
      ["suite", "Số nhà / Suite"],
      ["city", "Thành phố"],
    ];
    const ADDRESS_KEYS = ADDRESS_FIELDS.map(([key]) => key);

    const emptyUser = () => ({
      name: "", username: "", email: "",
      address: { street: "", suite: "", city: "" },
      phone: "", website: "",
    });

    // Hàm vẽ các ô input (hàm thường, không phải component)
    function renderFields(data, onChange, idPrefix = "") {
      const input = ([key, label]) => {
        const value = ADDRESS_KEYS.includes(key) ? data.address[key] : data[key];
        return (
          <div className="field" key={key}>
            <label htmlFor={idPrefix + key}>{label}</label>
            <input id={idPrefix + key} type="text" value={value} onChange={onChange} />
          </div>
        );
      };
      return (
        <React.Fragment>
          {MAIN_FIELDS.map(input)}
          <div className="group-title">Địa chỉ</div>
          {ADDRESS_FIELDS.map(input)}
        </React.Fragment>
      );
    }

    // Đóng modal khi nhấn Esc
    function useEscape(active, onClose) {
      React.useEffect(() => {
        if (!active) return;
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [active]);
    }

    /* ================= SearchForm ================= */
    function SearchForm({ onChangeValue }) {
      return (
        <input
          className="search"
          type="text"
          placeholder="Tìm theo name, username"
          onChange={(e) => onChangeValue(e.target.value)}
        />
      );
    }

    /* ================= AddUser ================= */
    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState(emptyUser());

      useEscape(adding, () => setAdding(false));

      const handleChange = (e) => {
        const { id, value } = e.target;
        if (ADDRESS_KEYS.includes(id)) {
          // Thuộc tính lồng: sao chép cả user lẫn address
          setUser({ ...user, address: { ...user.address, [id]: value } });
        } else {
          setUser({ ...user, [id]: value });
        }
      };

      const handleAdd = () => {
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd(user);
        setUser(emptyUser());
        setAdding(false);
      };

      return (
        <div>
          <button className="btn-primary" onClick={() => setAdding(true)}>+ Thêm</button>
          {adding && (
            <div className="modal-overlay" onClick={() => setAdding(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <h4>Thêm người dùng</h4>
                {renderFields(user, handleChange)}
                <div className="modal-actions">
                  {/* Lưu ý: phải là arrow function, KHÔNG viết onClick={setAdding(false)} */}
                  <button onClick={() => setAdding(false)}>Hủy</button>
                  <button className="btn-primary" onClick={handleAdd}>Thêm</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ================= ResultTable ================= */
    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [editing, setEditing] = React.useState(null);

      useEscape(editing !== null, () => setEditing(null));

      // Tải dữ liệu 1 lần khi component mount
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then((data) => { setUsers(data); setLoading(false); })
          .catch((err) => { setError(err.message); setLoading(false); });
      }, []);

      // Khi prop user thay đổi → thêm vào danh sách
      React.useEffect(() => {
        if (user) {
          setUsers((prev) => {
            // id mới = id lớn nhất + 1 (không dùng prev.length + 1 để tránh trùng key sau khi xóa)
            const maxId = prev.reduce((max, u) => Math.max(max, u.id), 0);
            return [...prev, { ...user, id: maxId + 1 }];
          });
          onAdded();
        }
      }, [user]);

      // Lọc theo keyword
      const kw = keyword.trim().toLowerCase();
      const filteredUsers = users.filter(
        (u) =>
          u.name.toLowerCase().includes(kw) ||
          u.username.toLowerCase().includes(kw)
      );

      // Sửa: deep copy để form không làm đổi dữ liệu gốc
      function editUser(u) {
        setEditing({ ...u, address: { ...u.address } });
      }

      function handleEditChange(field, value) {
        if (ADDRESS_KEYS.includes(field)) {
          setEditing((prev) => ({ ...prev, address: { ...prev.address, [field]: value } }));
        } else {
          setEditing((prev) => ({ ...prev, [field]: value }));
        }
      }

      function saveUser() {
        if (editing.name.trim() === "" || editing.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        setEditing(null);
      }

      // Xóa: tạo mảng mới bằng filter, không cần xác nhận
      function removeUser(id) {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      let body;
      if (loading) {
        body = <tr><td colSpan="7" className="empty">Đang tải dữ liệu…</td></tr>;
      } else if (error) {
        body = <tr><td colSpan="7" className="empty">Không tải được dữ liệu ({error}).</td></tr>;
      } else if (filteredUsers.length === 0) {
        body = <tr><td colSpan="7" className="empty">Không có người dùng phù hợp.</td></tr>;
      } else {
        body = filteredUsers.map((u) => (
          <tr key={u.id}>
            <td>{u.id}</td>
            <td>{u.name}</td>
            <td>{u.username}</td>
            <td>{u.email}</td>
            <td>{[u.address.street, u.address.suite, u.address.city].filter(Boolean).join(", ")}</td>
            <td>{u.phone}</td>
            <td className="actions">
              <button className="btn-edit" onClick={() => editUser(u)}>Sửa</button>
              <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
            </td>
          </tr>
        ));
      }

      return (
        <div>
          {!loading && !error && (
            <p className="status">Hiển thị {filteredUsers.length} / {users.length} người dùng</p>
          )}
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th><th>Họ tên</th><th>Username</th><th>Email</th>
                  <th>Địa chỉ</th><th>Số điện thoại</th><th>Thao tác</th>
                </tr>
              </thead>
              <tbody>{body}</tbody>
            </table>
          </div>

          {editing && (
            <div className="modal-overlay" onClick={() => setEditing(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <h4>Sửa người dùng #{editing.id}</h4>
                {renderFields(
                  editing,
                  (e) => handleEditChange(e.target.id.replace("edit-", ""), e.target.value),
                  "edit-"
                )}
                <div className="modal-actions">
                  <button onClick={() => setEditing(null)}>Hủy</button>
                  <button className="btn-primary" onClick={saveUser}>Lưu</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ================= App ================= */
    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);
      return (
        <div className="container">
          <nav className="top-links">
            <a href="../">← Trang chủ</a>
            <a href="bao-cao.html">Xem báo cáo</a>
          </nav>
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
